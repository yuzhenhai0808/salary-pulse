[package]
name = "salary-pulse"
version = "0.1.0"
description = "An offline bilingual workday companion for Apple Silicon Mac"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "salary_pulse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
rust_decimal = "1"
tempfile = "3"
